<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>筋トレ習慣トラッカー</title>
<meta name="description" content="毎日の筋トレ項目をチェックして達成率と連続記録を管理するアプリ">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="筋トレ">
<meta name="theme-color" content="#E1592C">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Big+Shoulders+Display:wght@700;800&display=swap">

<style>
  :root{
    color-scheme: light;
    --bg:#F7FAF1;
    --surface:#FFFFFF;
    --surface-2:#F4F2EC;
    --ink:#1B2621;
    --ink-soft:#57645C;
    --accent:#E1592C;
    --accent-strong:#C64A22;
    --accent-ink:#FFF8F4;
    --good:#2F7A5E;
    --good-soft:#DCEEE5;
    --line:rgba(27,38,33,0.12);
    --ring-track:rgba(27,38,33,0.08);
    --shadow:0 1px 2px rgba(27,38,33,0.06), 0 8px 24px -12px rgba(27,38,33,0.18);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* This app intentionally uses one bright look at all times, regardless
     of the device's dark mode setting. */
  *{box-sizing:border-box;}
  html, body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
    padding-inline:16px;
    padding-block:20px 32px;
    display:flex;
    justify-content:center;
  }
  img{max-width:100%;}
  [hidden]{display:none!important;}
  .stat-num{
    font-family:'Big Shoulders Display','Arial Narrow',sans-serif;
    font-variant-numeric:tabular-nums;
    font-weight:700;
  }
  #app{width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px;}

  .eyebrow{
    font-size:11.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:700;
  }
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .settings-btn{
    width:32px;height:32px;border-radius:50%;border:none;flex:none;
    background:var(--surface);box-shadow:var(--shadow);color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .settings-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .date-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px;
  }
  .date-heading{
    font-size:24px;
    font-weight:700;
    text-wrap:balance;
  }
  .date-nav{display:flex;align-items:center;gap:6px;flex:none;}
  .nav-btn{
    width:34px;height:34px;border-radius:50%;border:none;flex:none;
    background:var(--surface);box-shadow:var(--shadow);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .nav-btn:disabled{opacity:.3;cursor:default;}
  .nav-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
  .today-btn{
    border:none;background:var(--surface-2);color:var(--ink-soft);
    font-size:12px;font-weight:700;padding:0 12px;height:34px;border-radius:999px;
    cursor:pointer;font-family:inherit;white-space:nowrap;
  }

  .ring-card{
    background:var(--surface);
    border-radius:24px;
    padding:22px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:18px;
    position:sticky;
    top:env(safe-area-inset-top, 0px);
    z-index:5;
  }
  .ring-top{display:flex;align-items:center;gap:20px;}
  .ring-wrap{position:relative;width:132px;height:132px;flex:none;}
  .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-track{fill:none;stroke:var(--ring-track);stroke-width:11;}
  .ring-fill{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;transition:stroke-dasharray .5s ease, stroke .3s ease;}
  .ring-fill.complete{stroke:var(--good);}
  .ring-center{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .ring-pct{font-size:30px;line-height:1;color:var(--ink);}
  .ring-pct sup{font-size:15px;margin-left:1px;}
  .ring-label{font-size:11px;color:var(--ink-soft);margin-top:4px;letter-spacing:.06em;}

  .ring-side{display:flex;flex-direction:column;gap:12px;flex:1;min-width:0;}
  .frac{font-size:14px;color:var(--ink-soft);}
  .frac b{color:var(--ink);font-weight:700;}
  .streak-pill{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--good-soft);color:var(--good);
    padding:6px 12px;border-radius:999px;
    font-size:13px;font-weight:700;width:fit-content;
  }
  .streak-pill svg{width:15px;height:15px;flex:none;}
  .streak-pill.zero{background:var(--surface-2);color:var(--ink-soft);}

  .history-card{
    background:var(--surface);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);
  }
  .history-title{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:10px;}
  .history-row{display:flex;justify-content:space-between;gap:6px;}
  .history-day{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;}
  .history-sq{
    width:100%;aspect-ratio:1;max-width:34px;border-radius:8px;
    background:var(--ring-track);
  }
  .history-sq{cursor:pointer;}
  .history-sq.selected{outline:2px solid var(--accent);outline-offset:2px;}
  .history-labels{display:flex;flex-direction:column;align-items:center;gap:1px;}
  .history-wd{font-size:10.5px;color:var(--ink-soft);line-height:1.2;}
  .history-wd.is-today{color:var(--accent);font-weight:800;}
  .history-date{font-size:10px;color:var(--ink-soft);line-height:1.2;font-variant-numeric:tabular-nums;}
  .history-date.is-today{color:var(--accent);font-weight:800;}

  .list-card{
    background:var(--surface);border-radius:20px;padding:6px 6px 14px;box-shadow:var(--shadow);
  }
  .list-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px 8px;
  }
  .list-title{font-size:15px;font-weight:700;}
  .edit-toggle{
    border:none;background:var(--surface-2);color:var(--ink-soft);
    font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer;
    font-family:inherit;
  }
  .edit-toggle.on{background:var(--accent);color:var(--accent-ink);}

  .item-row{
    display:flex;align-items:center;gap:10px;
    padding:8px 14px;
    border-top:1px solid var(--line);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .item-row:active{background:var(--surface-2);}
  .item-row.locked{cursor:default;}
  .item-row.locked:active{background:transparent;}
  .checkbox{
    width:22px;height:22px;border-radius:50%;flex:none;
    border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, border-color .15s ease;
  }
  .checkbox svg{width:12px;height:12px;stroke:var(--accent-ink);opacity:0;transition:opacity .1s ease;}
  .checkbox.on{background:var(--good);border-color:var(--good);}
  .checkbox.on svg{opacity:1;stroke:#fff;}
  .item-text{display:flex;align-items:center;flex-wrap:wrap;row-gap:3px;column-gap:8px;flex:1;min-width:0;}
  .item-name{font-size:14.5px;overflow-wrap:anywhere;}
  .item-name.done{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--line);}
  .item-target-chip{
    font-size:11.5px;color:var(--ink-soft);background:var(--surface-2);
    padding:1px 8px;border-radius:999px;flex:none;font-variant-numeric:tabular-nums;
  }
  .item-target-chip.done{opacity:.6;}

  .item-row.edit-row{cursor:default;padding:6px 14px;}
  .item-row.edit-row:active{background:transparent;}
  .reorder-btns{display:flex;flex-direction:column;gap:3px;flex:none;}
  .reorder-btn{
    width:24px;height:19px;border:none;padding:0;
    background:var(--surface-2);color:var(--ink-soft);border-radius:6px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .reorder-btn:disabled{opacity:.3;cursor:default;}
  .reorder-btn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
  .edit-row-fields{display:flex;gap:8px;flex:1;min-width:0;}
  .item-input{
    flex:1.4;min-width:0;border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink);border-radius:10px;padding:9px 11px;font-size:15px;font-family:inherit;
  }
  .item-input-target{
    flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink);border-radius:10px;padding:9px 11px;font-size:15px;font-family:inherit;
  }
  .del-btn{
    width:30px;height:30px;border-radius:50%;flex:none;border:none;
    background:var(--surface-2);color:var(--ink-soft);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .del-btn svg{width:14px;height:14px;stroke:currentColor;}

  .add-row{
    display:flex;flex-direction:column;gap:8px;padding:12px 14px 4px;
  }
  .add-row-fields{display:flex;gap:8px;}
  .add-input{
    width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;
  }
  .add-input-target{
    flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;
  }
  .add-input::placeholder, .add-input-target::placeholder{color:var(--ink-soft);}
  .add-btn{
    border:none;background:var(--accent);color:var(--accent-ink);
    font-weight:700;font-size:14px;padding:0 16px;border-radius:10px;cursor:pointer;font-family:inherit;flex:none;
  }
  .add-btn:disabled{opacity:.4;}

  .empty-note{padding:18px 14px;color:var(--ink-soft);font-size:13.5px;line-height:1.6;}

  .lock-row{padding:10px 14px 4px;}
  .lock-btn{
    width:100%;border:none;background:var(--accent);color:var(--accent-ink);
    font-weight:700;font-size:13.5px;padding:11px;border-radius:12px;cursor:pointer;font-family:inherit;
  }
  .lock-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .lock-banner-label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--good);font-weight:700;}
  .lock-banner-label svg{width:14px;height:14px;fill:none;stroke:var(--good);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .unlock-btn{
    border:none;background:var(--surface-2);color:var(--ink-soft);
    font-weight:700;font-size:12px;padding:8px 14px;border-radius:999px;cursor:pointer;font-family:inherit;flex:none;
  }

  .ring-message{
    background:linear-gradient(155deg, var(--accent) 0%, var(--accent-strong) 100%);
    color:var(--accent-ink);
    border-radius:16px;padding:14px 16px;
  }
  .ring-message.complete{
    background:linear-gradient(155deg, var(--good) 0%, #1F5E46 100%);
  }
  .ring-message-eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;font-weight:700;}
  .ring-message-text{font-size:15px;font-weight:700;margin-top:6px;line-height:1.5;text-wrap:balance;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,24,20,0.45);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
    padding:0 16px;
  }
  .modal-sheet{
    width:100%;max-width:440px;background:var(--surface);
    border-radius:20px 20px 0 0;padding:20px;
    padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    box-shadow:0 -8px 30px rgba(0,0,0,0.2);
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-title{font-size:16px;font-weight:700;}
  .modal-close{
    width:30px;height:30px;border-radius:50%;border:none;flex:none;
    background:var(--surface-2);color:var(--ink-soft);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .modal-close svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;}

  .backup-card{
    display:flex;flex-direction:column;gap:10px;
  }
  .backup-title{font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .backup-buttons{display:flex;gap:10px;}
  .backup-btn{
    flex:1;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
    font-weight:700;font-size:13.5px;padding:10px 8px;border-radius:12px;cursor:pointer;font-family:inherit;
  }
  .backup-btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
  .backup-status{font-size:12.5px;color:var(--ink-soft);min-height:1.2em;}
  .backup-status.ok{color:var(--good);}
  .backup-status.err{color:var(--accent-strong);}
  .backup-hint{font-size:11.5px;color:var(--ink-soft);line-height:1.6;}

  @media (prefers-reduced-motion: reduce){
    .ring-fill{transition:none;}
  }
</style>
</head>
<body>

<div id="app"></div>
<input type="file" id="restore-input" accept="application/json,.json" hidden>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = 'strength-tracker-state-v1';

  var DEFAULT_STATE = {
    items: [
      {id:'i1', name:'腕立て伏せ', target:'20回'},
      {id:'i2', name:'スクワット', target:'20回'},
      {id:'i3', name:'腹筋', target:'20回'},
      {id:'i4', name:'プランク', target:'1分'}
    ],
    logs: {}
  };

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
      var parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.items) || typeof parsed.logs !== 'object'){
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
      return parsed;
    }catch(e){
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      /* storage unavailable (private mode, quota) — app still works this session */
    }
  }

  var state = loadState();
  var editMode = false;
  var viewDate = new Date();
  var settingsOpen = false;
  var backupStatus = { text: '', kind: '' };
  var backupStatusTimer = null;

  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  var WD = ['日','月','火','水','木','金','土'];
  function fmtDateJP(d){ return (d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'）'; }
  function isViewingToday(){ return dateKey(viewDate) === dateKey(new Date()); }

  function getLog(key){
    var l = state.logs[key];
    if(!l) return { checked: [], locked: false };
    if(Array.isArray(l)) return { checked: l, locked: false };
    return { checked: l.checked || [], locked: !!l.locked };
  }
  function checkedFor(key){ return getLog(key).checked; }
  function isLocked(key){ return getLog(key).locked; }
  function setChecked(key, arr){
    var log = getLog(key);
    log.checked = arr;
    state.logs[key] = log;
  }
  function setLocked(key, val){
    var log = getLog(key);
    log.locked = val;
    state.logs[key] = log;
  }
  function rateFor(key){
    var total = state.items.length;
    if(total === 0) return 0;
    return checkedFor(key).length / total;
  }
  function isDayComplete(key){
    return state.items.length > 0 && checkedFor(key).length >= state.items.length;
  }
  function computeStreak(){
    var streak = 0;
    var d = new Date();
    for(var i=0;i<365;i++){
      var key = dateKey(d);
      if(isDayComplete(key)){ streak++; d.setDate(d.getDate()-1); }
      else break;
    }
    return streak;
  }

  var MESSAGES = {
    zero: ['さあ、はじめよう。最初の1つが一番大事。','まだこれから。1種目からスタート。'],
    low: ['いいペース、この調子で。','半分まで来たら勢いに乗れる。'],
    mid: ['あと少しで達成！ラストスパート。','ここまで来たら完走しよう。'],
    full: ['完全達成！お疲れさまでした。','パーフェクト。この調子をキープ。']
  };
  function pickMessage(rate, key){
    var bucket = rate >= 1 ? 'full' : rate >= 0.5 ? 'mid' : rate > 0 ? 'low' : 'zero';
    var arr = MESSAGES[bucket];
    var idx = 0;
    for(var i=0;i<key.length;i++){ idx += key.charCodeAt(i); }
    return { text: arr[idx % arr.length], complete: rate >= 1 };
  }

  var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
  var ICON_FLAME = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-3 4-3 8a3 3 0 0 0 6 0c1 1 2 2.5 2 5a5 5 0 0 1-10 0c0-4 2-6 3-8 .3 1 1 1.5 1 2 0-3-1.5-5.5 1-7z"/></svg>';
  var ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  var ICON_CHEV_LEFT = '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>';
  var ICON_CHEV_RIGHT = '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
  var ICON_CHEV_UP = '<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>';
  var ICON_CHEV_DOWN = '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
  var ICON_GEAR = '<svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V19.6a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.96 18a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.04H2.9a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 6.96a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 2.6a1.7 1.7 0 0 0 1.04-1.56V.9a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 2.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87c.27.63.86 1.04 1.56 1.04h.09a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.04z"/></svg>';
  var ICON_CLOSE = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function ringSection(){
    var key = dateKey(viewDate);
    var rate = rateFor(key);
    var total = state.items.length;
    var doneCount = checkedFor(key).length;
    var C = 2*Math.PI*52;
    var dash = Math.max(0, Math.min(1, rate)) * C;
    var streak = computeStreak();
    var pct = Math.round(rate*100);
    var label = isViewingToday() ? '今日' : fmtDateJP(viewDate).replace(/（.）/,'');
    var m = pickMessage(rate, key);
    return (
      '<div class="ring-card">' +
        '<div class="ring-top">' +
          '<div class="ring-wrap">' +
            '<svg viewBox="0 0 120 120">' +
              '<circle class="ring-track" cx="60" cy="60" r="52"></circle>' +
              '<circle class="ring-fill' + (rate>=1?' complete':'') + '" cx="60" cy="60" r="52" ' +
                'stroke-dasharray="' + dash.toFixed(1) + ' ' + C.toFixed(1) + '"></circle>' +
            '</svg>' +
            '<div class="ring-center">' +
              '<div class="ring-pct stat-num">' + pct + '<sup>%</sup></div>' +
              '<div class="ring-label">達成率</div>' +
            '</div>' +
          '</div>' +
          '<div class="ring-side">' +
            '<div class="frac">' + label + ' <b>' + doneCount + ' / ' + total + '</b> 種目 完了</div>' +
            '<div class="streak-pill' + (streak===0?' zero':'') + '">' + (streak>0?ICON_FLAME:'') +
              (streak>0 ? streak + '日連続達成' : '連続0日・今日からスタート') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="ring-message' + (m.complete?' complete':'') + '">' +
          '<div class="ring-message-eyebrow">Today\'s Message</div>' +
          '<div class="ring-message-text">' + escapeHtml(m.text) + '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function historySection(){
    var today = new Date();
    var todayKey = dateKey(today);
    var viewKey = dateKey(viewDate);
    var days = [];
    for(var i=6;i>=0;i--){
      var d = new Date(today);
      d.setDate(d.getDate()-i);
      days.push(d);
    }
    var cells = days.map(function(d){
      var key = dateKey(d);
      var r = rateFor(key);
      var isRealToday = key === todayKey;
      var isSelected = key === viewKey;
      var bg;
      if(r>=1) bg = 'var(--good)';
      else if(r>0.5) bg = 'var(--accent)';
      else if(r>0) bg = 'color-mix(in srgb, var(--accent) 45%, var(--ring-track))';
      else bg = 'var(--ring-track)';
      return (
        '<div class="history-day">' +
          '<div class="history-sq' + (isSelected?' selected':'') + '" data-jump-date="' + key + '" style="background:' + bg + '" title="' + (d.getMonth()+1) + '/' + d.getDate() + '"></div>' +
          '<div class="history-labels">' +
            '<div class="history-wd' + (isRealToday?' is-today':'') + '">' + WD[d.getDay()] + '</div>' +
            '<div class="history-date' + (isRealToday?' is-today':'') + '">' + d.getDate() + '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');
    return (
      '<div class="history-card">' +
        '<div class="history-title">直近7日間</div>' +
        '<div class="history-row">' + cells + '</div>' +
      '</div>'
    );
  }

  function listSection(){
    var key = dateKey(viewDate);
    var checked = checkedFor(key);
    var locked = isLocked(key);
    var hasItems = state.items.length > 0;
    var rows;
    if(!hasItems){
      rows = '<div class="empty-note">まだ種目がありません。下の「編集」から追加しましょう。</div>';
    } else if(editMode){
      rows = state.items.map(function(item, idx){
        return (
          '<div class="item-row edit-row">' +
            '<div class="reorder-btns">' +
              '<button class="reorder-btn" data-move-up="' + item.id + '" aria-label="上へ移動"' + (idx===0?' disabled':'') + '>' + ICON_CHEV_UP + '</button>' +
              '<button class="reorder-btn" data-move-down="' + item.id + '" aria-label="下へ移動"' + (idx===state.items.length-1?' disabled':'') + '>' + ICON_CHEV_DOWN + '</button>' +
            '</div>' +
            '<div class="edit-row-fields">' +
              '<input class="item-input" value="' + escapeHtml(item.name) + '" data-rename="' + item.id + '" placeholder="種目名">' +
              '<input class="item-input-target" value="' + escapeHtml(item.target||'') + '" data-rename-target="' + item.id + '" placeholder="回数・時間">' +
            '</div>' +
            '<button class="del-btn" data-del="' + item.id + '" aria-label="削除">' + ICON_X + '</button>' +
          '</div>'
        );
      }).join('');
    } else {
      rows = state.items.map(function(item){
        var on = checked.indexOf(item.id) !== -1;
        return (
          '<div class="item-row' + (locked?' locked':'') + '"' + (locked?'':' data-toggle="' + item.id + '"') + '>' +
            '<div class="checkbox' + (on?' on':'') + '">' + ICON_CHECK + '</div>' +
            '<div class="item-text">' +
              '<div class="item-name' + (on?' done':'') + '">' + escapeHtml(item.name) + '</div>' +
              (item.target ? '<div class="item-target-chip' + (on?' done':'') + '">' + escapeHtml(item.target) + '</div>' : '') +
            '</div>' +
          '</div>'
        );
      }).join('');
    }
    var addRow = editMode ? (
      '<div class="add-row">' +
        '<input class="add-input" id="new-item-input" placeholder="種目名（例：ランジ）" maxlength="30">' +
        '<div class="add-row-fields">' +
          '<input class="add-input-target" id="new-item-target-input" placeholder="回数・時間（例：15回）" maxlength="20">' +
          '<button class="add-btn" id="add-item-btn">追加</button>' +
        '</div>' +
      '</div>'
    ) : '';
    var lockRow = (!editMode && hasItems) ? (
      locked ? (
        '<div class="lock-row lock-banner">' +
          '<div class="lock-banner-label">' + ICON_CHECK + '完了として記録済み</div>' +
          '<button class="unlock-btn" id="unlock-btn">編集し直す</button>' +
        '</div>'
      ) : (
        '<div class="lock-row"><button class="lock-btn" id="lock-btn">この日を完了にする</button></div>'
      )
    ) : '';
    return (
      '<div class="list-card">' +
        '<div class="list-head">' +
          '<div class="list-title">' + (isViewingToday() ? '今日のメニュー' : 'この日のメニュー') + '</div>' +
          '<button class="edit-toggle' + (editMode?' on':'') + '" id="edit-toggle-btn">' + (editMode?'閉じる':'編集') + '</button>' +
        '</div>' +
        rows +
        addRow +
        lockRow +
      '</div>'
    );
  }

  function settingsModal(){
    if(!settingsOpen) return '';
    var statusClass = backupStatus.kind === 'ok' ? ' ok' : backupStatus.kind === 'err' ? ' err' : '';
    return (
      '<div class="modal-backdrop" id="settings-backdrop">' +
        '<div class="modal-sheet">' +
          '<div class="modal-head">' +
            '<div class="modal-title">設定</div>' +
            '<button class="modal-close" id="settings-close-btn" aria-label="閉じる">' + ICON_CLOSE + '</button>' +
          '</div>' +
          '<div class="backup-card">' +
            '<div class="backup-title">バックアップ</div>' +
            '<div class="backup-buttons">' +
              '<button class="backup-btn primary" id="export-btn">バックアップを保存</button>' +
              '<button class="backup-btn" id="import-btn">ファイルから復元</button>' +
            '</div>' +
            '<div class="backup-status' + statusClass + '">' + escapeHtml(backupStatus.text) + '</div>' +
            '<div class="backup-hint">保存すると記録をJSONファイルとして書き出せます。機種変更の前や、iPhoneの「ブラウザデータを消去」をする前に保存しておくと安心です。</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function appInnerHtml(){
    var isToday = isViewingToday();
    return (
      '<div class="top-row">' +
        '<div class="eyebrow">' + (isToday ? '今日のトレーニング' : '過去の記録を編集中') + '</div>' +
        '<button class="settings-btn" id="settings-btn" aria-label="設定">' + ICON_GEAR + '</button>' +
      '</div>' +
      '<div class="date-row">' +
        '<div class="date-heading">' + fmtDateJP(viewDate) + '</div>' +
        '<div class="date-nav">' +
          (!isToday ? '<button class="today-btn" id="today-btn">今日に戻る</button>' : '') +
          '<button class="nav-btn" id="prev-day-btn" aria-label="前の日">' + ICON_CHEV_LEFT + '</button>' +
          '<button class="nav-btn" id="next-day-btn" aria-label="次の日"' + (isToday?' disabled':'') + '>' + ICON_CHEV_RIGHT + '</button>' +
        '</div>' +
      '</div>' +
      ringSection() +
      historySection() +
      listSection() +
      settingsModal()
    );
  }

  function paint(){
    document.getElementById('app').innerHTML = appInnerHtml();
    bind();
  }

  function persist(){
    saveState();
    paint();
  }

  function toggleItem(id){
    var key = dateKey(viewDate);
    if(isLocked(key)) return;
    var arr = checkedFor(key).slice();
    var i = arr.indexOf(id);
    if(i === -1) arr.push(id); else arr.splice(i,1);
    setChecked(key, arr);
    persist();
  }

  function lockDay(){
    setLocked(dateKey(viewDate), true);
    persist();
  }

  function unlockDay(){
    setLocked(dateKey(viewDate), false);
    persist();
  }

  function deleteItem(id){
    state.items = state.items.filter(function(it){ return it.id !== id; });
    persist();
  }

  function moveItem(id, delta){
    var i = -1;
    for(var k=0;k<state.items.length;k++){ if(state.items[k].id === id){ i = k; break; } }
    if(i === -1) return;
    var j = i + delta;
    if(j < 0 || j >= state.items.length) return;
    var tmp = state.items[i];
    state.items[i] = state.items[j];
    state.items[j] = tmp;
    persist();
  }

  function jumpToDate(key){
    var parts = key.split('-').map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    if(dateKey(d) > dateKey(new Date())) return;
    viewDate = d;
    paint();
  }

  function shiftDay(delta){
    var d = new Date(viewDate);
    d.setDate(d.getDate()+delta);
    if(dateKey(d) > dateKey(new Date())) return;
    viewDate = d;
    paint();
  }

  function goToday(){
    viewDate = new Date();
    paint();
  }

  function updateItem(id, patch){
    var it = state.items.filter(function(x){ return x.id === id; })[0];
    if(!it) return;
    if(patch.name !== undefined){
      var n = patch.name.trim();
      if(n) it.name = n;
    }
    if(patch.target !== undefined){
      it.target = patch.target.trim();
    }
    persist();
  }

  function addItem(name, target){
    name = name.trim();
    if(!name) return;
    state.items.push({ id: 'i' + Date.now() + Math.floor(Math.random()*1000), name: name, target: (target||'').trim() });
    persist();
  }

  function setBackupStatus(text, kind){
    backupStatus = { text: text, kind: kind || '' };
    var el = document.querySelector('.backup-status');
    if(el){
      el.textContent = text;
      el.className = 'backup-status' + (kind ? ' ' + kind : '');
    }
    if(backupStatusTimer) clearTimeout(backupStatusTimer);
    backupStatusTimer = setTimeout(function(){
      backupStatus = { text:'', kind:'' };
      var el2 = document.querySelector('.backup-status');
      if(el2){ el2.textContent=''; el2.className='backup-status'; }
    }, 4000);
  }

  function exportBackup(){
    try{
      var data = JSON.stringify({
        app: 'strength-tracker',
        version: 1,
        exportedAt: new Date().toISOString(),
        state: state
      }, null, 2);
      var blob = new Blob([data], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var d = new Date();
      var fname = 'training-backup-' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '.json';
      var a = document.createElement('a');
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      setBackupStatus('バックアップを保存しました。', 'ok');
    }catch(e){
      setBackupStatus('保存に失敗しました。', 'err');
    }
  }

  function importBackup(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        var incoming = parsed && parsed.state ? parsed.state : parsed;
        if(!incoming || !Array.isArray(incoming.items) || typeof incoming.logs !== 'object'){
          throw new Error('invalid shape');
        }
        var ok = window.confirm('現在の記録をこのバックアップで上書きします。よろしいですか？');
        if(!ok) return;
        state = incoming;
        saveState();
        paint();
        setBackupStatus('バックアップから復元しました。', 'ok');
      }catch(e){
        setBackupStatus('読み込みに失敗しました。ファイルを確認してください。', 'err');
      }
    };
    reader.onerror = function(){
      setBackupStatus('ファイルの読み込みに失敗しました。', 'err');
    };
    reader.readAsText(file);
  }

  function bind(){
    var app = document.getElementById('app');
    app.querySelectorAll('[data-toggle]').forEach(function(el){
      el.addEventListener('click', function(){ toggleItem(el.getAttribute('data-toggle')); });
    });
    app.querySelectorAll('[data-del]').forEach(function(el){
      el.addEventListener('click', function(){ deleteItem(el.getAttribute('data-del')); });
    });
    app.querySelectorAll('[data-move-up]').forEach(function(el){
      el.addEventListener('click', function(){ moveItem(el.getAttribute('data-move-up'), -1); });
    });
    app.querySelectorAll('[data-move-down]').forEach(function(el){
      el.addEventListener('click', function(){ moveItem(el.getAttribute('data-move-down'), 1); });
    });
    app.querySelectorAll('[data-rename]').forEach(function(el){
      el.addEventListener('change', function(){ updateItem(el.getAttribute('data-rename'), {name: el.value}); });
    });
    app.querySelectorAll('[data-rename-target]').forEach(function(el){
      el.addEventListener('change', function(){ updateItem(el.getAttribute('data-rename-target'), {target: el.value}); });
    });
    app.querySelectorAll('[data-jump-date]').forEach(function(el){
      el.addEventListener('click', function(){ jumpToDate(el.getAttribute('data-jump-date')); });
    });
    var prevBtn = document.getElementById('prev-day-btn');
    if(prevBtn) prevBtn.addEventListener('click', function(){ shiftDay(-1); });
    var nextBtn = document.getElementById('next-day-btn');
    if(nextBtn) nextBtn.addEventListener('click', function(){ shiftDay(1); });
    var todayBtn = document.getElementById('today-btn');
    if(todayBtn) todayBtn.addEventListener('click', goToday);
    var lockBtn = document.getElementById('lock-btn');
    if(lockBtn) lockBtn.addEventListener('click', lockDay);
    var unlockBtn = document.getElementById('unlock-btn');
    if(unlockBtn) unlockBtn.addEventListener('click', unlockDay);
    var settingsBtn = document.getElementById('settings-btn');
    if(settingsBtn) settingsBtn.addEventListener('click', function(){ settingsOpen = true; paint(); });
    var settingsCloseBtn = document.getElementById('settings-close-btn');
    if(settingsCloseBtn) settingsCloseBtn.addEventListener('click', function(){ settingsOpen = false; paint(); });
    var settingsBackdrop = document.getElementById('settings-backdrop');
    if(settingsBackdrop){
      settingsBackdrop.addEventListener('click', function(e){
        if(e.target === settingsBackdrop){ settingsOpen = false; paint(); }
      });
    }
    var editBtn = document.getElementById('edit-toggle-btn');
    if(editBtn){
      editBtn.addEventListener('click', function(){ editMode = !editMode; paint(); });
    }
    var addBtn = document.getElementById('add-item-btn');
    var addInput = document.getElementById('new-item-input');
    var addTargetInput = document.getElementById('new-item-target-input');
    function submitAdd(){
      addItem(addInput.value, addTargetInput ? addTargetInput.value : '');
      addInput.value='';
      if(addTargetInput) addTargetInput.value='';
    }
    if(addBtn && addInput){
      addBtn.addEventListener('click', submitAdd);
      addInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') submitAdd(); });
      if(addTargetInput){
        addTargetInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') submitAdd(); });
      }
    }
    var exportBtn = document.getElementById('export-btn');
    if(exportBtn) exportBtn.addEventListener('click', exportBackup);
    var importBtn = document.getElementById('import-btn');
    var fileInput = document.getElementById('restore-input');
    if(importBtn && fileInput){
      importBtn.addEventListener('click', function(){ fileInput.click(); });
      fileInput.addEventListener('change', function(){
        if(fileInput.files && fileInput.files[0]){
          importBackup(fileInput.files[0]);
        }
        fileInput.value = '';
      });
    }
  }

  paint();

  if('serviceWorker' in navigator){
    // no service worker shipped — app works fully online via GitHub Pages;
    // localStorage persists data between visits without one.
  }
})();
</script>
</body>
</html>
